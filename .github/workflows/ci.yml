name: CI

on:
  push:
    branches: [main, feat/kanban-mvp]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scrum
          POSTGRES_PASSWORD: scrum
          POSTGRES_DB: scrum_kanban_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://scrum:scrum@localhost:5434/scrum_kanban_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-chars-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-chars-long
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
      NODE_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test -- --forceExit --passWithNoTests
      - run: npm run test:e2e -- --forceExit
      - run: npm run build

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    needs: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scrum
          POSTGRES_PASSWORD: scrum
          POSTGRES_DB: scrum_kanban_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://scrum:scrum@localhost:5434/scrum_kanban_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-chars-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-chars-long
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_WS_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate
      - name: Migrate + seed
        working-directory: backend
        run: npx prisma migrate deploy && npx prisma db seed || true
      - name: Build backend
        working-directory: backend
        run: npm run build
      - name: Start API
        working-directory: backend
        run: nohup node dist/main &
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Wait for API and start Next
        working-directory: frontend
        run: |
          npx wait-on http://localhost:3001/api/v1/health --timeout 30000
          nohup npm run start &
          npx wait-on http://localhost:3000 --timeout 30000
      - name: Cypress e2e
        working-directory: frontend
        run: npm run cypress:run

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          vercel-args: '--prod'
        continue-on-error: true
      - run: echo "Backend: configure Railway GitHub integration apontando para /backend"
